[project]
name = "tailr-server"
version = "0.1.0"
description = "Tailr backend — auth, resume parsing, and JD-tailored resume generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "pyjwt",
    "bcrypt",
    "python-multipart",
    "anthropic",
    "openai",
    "pypdf",
    "httpx==0.27.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

# Application, not a library — don't try to build/install the project itself.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
