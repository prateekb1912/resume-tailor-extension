[project]
name = "tailr-server"
version = "0.1.0"
description = "Tailr backend — auth, resume parsing, and JD-tailored resume generation"
requires-python = ">=3.11"

# Dependencies are managed by pipenv — see Pipfile / Pipfile.lock.

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
