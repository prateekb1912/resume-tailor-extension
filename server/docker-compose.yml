services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: tailr
    ports: ["5433:5432"]
    volumes: ["tailr_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d tailr"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  tailr_pgdata: {}
