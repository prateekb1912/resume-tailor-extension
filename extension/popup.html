<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
    }

    .header {
      background: #1e40af;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
    }

    .header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #93c5fd;
      flex-shrink: 0;
    }

    .body {
      padding: 14px 16px;
    }

    .screen.hidden {
      display: none;
    }

    .auth-screen {
      min-height: 390px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      padding: 16px 0 24px;
    }

    .app-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-intro {
      text-align: center;
      padding: 0 18px;
    }

    .auth-mark {
      width: 42px;
      height: 42px;
      margin: 0 auto 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #1e40af;
      font-size: 22px;
      font-weight: 700;
    }

    .auth-intro h2 {
      color: #111827;
      font-size: 18px;
      line-height: 1.25;
    }

    .auth-intro p {
      margin-top: 5px;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.45;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #9ca3af;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* ── Account ── */
    .account-card {
      border: 1px solid #dbeafe;
      border-radius: 8px;
      padding: 10px 12px;
      background: #f8fbff;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .auth-input {
      width: 100%;
      font: inherit;
      font-size: 12px;
      padding: 7px 9px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      color: #111827;
      outline: none;
      background: #fff;
    }

    .auth-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px #dbeafe;
    }

    .auth-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .auth-btn {
      padding: 7px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .auth-login {
      border: none;
      color: #fff;
      background: #1e40af;
    }

    .auth-register {
      border: 1px solid #bfdbfe;
      color: #1e40af;
      background: #fff;
    }

    .auth-status {
      min-height: 14px;
      font-size: 11px;
      color: #6b7280;
    }

    .auth-status.error {
      color: #dc2626;
    }

    .account-session {
      display: none;
      align-items: center;
      gap: 9px;
    }

    .account-session.visible {
      display: flex;
    }

    .account-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e40af;
      background: #dbeafe;
      font-weight: 700;
      flex-shrink: 0;
    }

    .account-copy {
      flex: 1;
      min-width: 0;
    }

    .account-email {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
      color: #111827;
    }

    .account-note {
      margin-top: 1px;
      color: #16a34a;
      font-size: 10px;
    }

    .sign-out {
      border: none;
      padding: 0;
      color: #6b7280;
      background: transparent;
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ── Resume card ── */
    .resume-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
    }

    /* empty state */
    .resume-empty {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-pick {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-pick-btn {
      padding: 4px 10px;
      font-size: 11px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      background: #f9fafb;
      cursor: pointer;
      color: #374151;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .file-pick-btn:hover {
      background: #f3f4f6;
    }

    .file-name {
      font-size: 11px;
      color: #9ca3af;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-name.selected {
      color: #1e40af;
    }

    .parse-btn {
      width: 100%;
      padding: 7px;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
    }

    .parse-btn:hover:not(:disabled) {
      background: #e5e7eb;
    }

    .parse-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .parse-status {
      font-size: 11px;
      color: #6b7280;
      min-height: 14px;
    }

    .parse-status.error {
      color: #dc2626;
    }

    .parse-status.success {
      color: #16a34a;
    }

    /* loaded state */
    .resume-loaded {
      display: none;
    }

    .resume-loaded.visible {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .resume-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #dcfce7;
      color: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .resume-meta {
      flex: 1;
      min-width: 0;
    }

    .resume-name {
      font-weight: 600;
      font-size: 13px;
      color: #111;
    }

    .resume-stats {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    .resume-update {
      font-size: 11px;
      color: #6b7280;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .resume-update:hover {
      color: #374151;
    }

    /* ── JD section ── */
    /* Editable so the user can fix a missed/wrong extraction. Looks like plain
       text until hovered/focused, when a subtle underline appears. */
    .jd-title,
    .jd-company {
      display: block;
      width: 100%;
      border: none;
      border-bottom: 1px solid transparent;
      background: transparent;
      padding: 2px 0;
      outline: none;
      font-family: inherit;
    }

    .jd-title {
      font-size: 14px;
      font-weight: 600;
      color: #111;
      line-height: 1.3;
    }

    .jd-company {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
    }

    .jd-title:hover,
    .jd-company:hover {
      border-bottom-color: #e5e7eb;
    }

    .jd-title:focus,
    .jd-company:focus {
      border-bottom-color: #6366f1;
    }

    .jd-preview {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #374151;
      line-height: 1.5;
      height: 90px;
      resize: vertical;
      overflow: auto;
      margin-top: 8px;
      font-family: inherit;
    }

    .jd-preview:focus {
      outline: none;
      border-color: #6366f1;
      background: #fff;
    }

    .jd-chars {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 4px;
    }

    /* ── Match score ── */
    .match {
      display: none;
      margin-top: 10px;
    }

    .match.visible {
      display: block;
    }

    .match-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .match-label {
      font-size: 11px;
      font-weight: 600;
      color: #374151;
    }

    .match-pct {
      font-size: 13px;
      font-weight: 700;
    }

    .match-bar {
      height: 6px;
      border-radius: 3px;
      background: #f1f1f4;
      overflow: hidden;
    }

    .match-fill {
      height: 100%;
      width: 0;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .match-note {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 4px;
    }

    /* ── Settings ── */
    .settings-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-row label {
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
    }

    .settings-row input {
      flex: 1;
      font-size: 11px;
      padding: 4px 7px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      color: #374151;
      outline: none;
    }

    .settings-row input:focus {
      border-color: #3b82f6;
    }

    .api-settings summary {
      color: #9ca3af;
      font-size: 10px;
      cursor: pointer;
      user-select: none;
    }

    .api-settings .settings-row {
      margin-top: 7px;
    }

    /* ── Main action ── */
    .tailor-btn {
      width: 100%;
      padding: 10px;
      background: #1e40af;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }

    .tailor-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .tailor-btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .tailor-btn.loading {
      color: transparent;
    }

    .tailor-btn.loading::after {
      content: 'Tailoring resume…';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 13px;
    }

    .tailor-status {
      font-size: 12px;
      color: #6b7280;
      min-height: 16px;
    }

    .tailor-status.error {
      color: #dc2626;
    }

    .tailor-status.success {
      color: #16a34a;
    }

    .download-btn {
      display: none;
      width: 100%;
      padding: 9px;
      background: #15803d;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .download-btn:hover {
      background: #166534;
    }

    .download-btn.visible {
      display: block;
    }

    hr {
      border: none;
      border-top: 1px solid #f3f4f6;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="dot"></div>
    <h1>Tailr</h1>
  </div>

  <div class="body">

    <!-- Authentication is its own screen. The app is revealed after sign-in. -->
    <section class="screen auth-screen" id="auth-view">
      <div class="auth-intro">
        <div class="auth-mark">T</div>
        <h2>Welcome to Tailr</h2>
        <p>Sign in to access your résumé and tailor it for the job on this page.</p>
      </div>

      <div class="account-card">
        <form class="auth-form" id="auth-form">
          <input class="auth-input" type="email" id="user-email" placeholder="you@example.com"
            autocomplete="email" required>
          <input class="auth-input" type="password" id="user-password" placeholder="Password (8+ characters)"
            autocomplete="current-password" minlength="8" maxlength="128" required>
          <div class="auth-actions">
            <button class="auth-btn auth-login" id="login-btn" type="submit">Sign in</button>
            <button class="auth-btn auth-register" id="register-btn" type="button">Create account</button>
          </div>
          <div class="auth-status" id="auth-status"></div>
        </form>
      </div>

      <details class="api-settings">
        <summary>Connection settings</summary>
        <div class="settings-row">
          <label>API</label>
          <input type="url" id="server-url" placeholder="https://tailr-api.onrender.com">
        </div>
      </details>
    </section>

    <section class="screen app-screen hidden" id="app-view">
      <!-- Compact account row on the authenticated app screen -->
      <div class="account-card">
        <div class="account-session" id="account-session">
          <div class="account-badge" id="account-badge">T</div>
          <div class="account-copy">
            <div class="account-email" id="account-email"></div>
            <div class="account-note">Connected to Tailr</div>
          </div>
          <button class="sign-out" id="logout-btn" type="button">Sign out</button>
        </div>
      </div>

      <!-- Resume profile -->
      <div>
        <div class="section-label">Resume Profile</div>
        <div class="resume-card">

        <!-- Empty / upload state -->
        <div class="resume-empty" id="resume-empty">
          <div class="file-pick">
            <button class="file-pick-btn" id="file-pick-btn">Choose file</button>
            <span class="file-name" id="file-name">PDF only</span>
            <input type="file" id="resume-file" accept=".pdf,application/pdf">
          </div>
          <button class="parse-btn" id="parse-btn" disabled>Parse &amp; Save Resume</button>
          <div class="parse-status" id="parse-status"></div>
        </div>

        <!-- Loaded state -->
        <div class="resume-loaded" id="resume-loaded">
          <div class="resume-check">✓</div>
          <div class="resume-meta">
            <div class="resume-name" id="resume-name"></div>
            <div class="resume-stats" id="resume-stats"></div>
          </div>
          <button class="resume-update" id="resume-update">Update</button>
        </div>

        </div>
      </div>

      <hr>

      <!-- Job description -->
      <div>
        <div class="section-label">Job Detected</div>
        <input class="jd-title" id="jd-title" placeholder="Job title" spellcheck="false">
        <input class="jd-company" id="jd-company" placeholder="Company" spellcheck="false">
        <textarea class="jd-preview" id="jd-preview" spellcheck="false"
          placeholder="Job description — edit or paste here if extraction missed it."></textarea>
        <div class="jd-chars" id="jd-chars"></div>

        <div class="match" id="match">
          <div class="match-head">
            <span class="match-label">Resume match</span>
            <span class="match-pct" id="match-pct">—</span>
          </div>
          <div class="match-bar">
            <div class="match-fill" id="match-fill"></div>
          </div>
          <div class="match-note" id="match-note"></div>
        </div>
      </div>

      <hr>

      <!-- Action -->
      <button class="tailor-btn" id="tailor-btn" disabled>Tailor Resume</button>
      <div class="tailor-status" id="tailor-status"></div>
      <button class="download-btn" id="download-btn">📄 Open Résumé → Save as PDF</button>
    </section>

  </div>

  <script src="popup.js"></script>
</body>

</html>
